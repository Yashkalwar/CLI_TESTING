name: ui-tests
on: [push, workflow_dispatch]

jobs:
  ui-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'

      - name: Install shiny (CRAN)
        run: Rscript -e "install.packages('shiny', repos='https://cloud.r-project.org')"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test deps
        run: pip install -r tests/ui/requirements-test.txt

      - name: Run UI tests
        run: pytest tests/ui -v --junitxml test-results/results.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
